# Reverse proxy for the containerized backends (compose.yaml, profile "apps").
# Routes by path the way frontend/vite.config.ts does in development: longest prefix first.
#   /api/visits  -> visitor:8081
#   /api/stocks  -> stocks:8082
#   everything else (UI + /api/hello, /api/overview, /actuator) -> facade:8080
# Service names resolve through Compose's embedded DNS; the containers exist before nginx starts
# (depends_on), so the names resolve even while a backend is still booting.
server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/visits {
        proxy_pass http://visitor:8081;
    }

    location /api/stocks {
        proxy_pass http://stocks:8082;
    }

    location / {
        proxy_pass http://facade:8080;
    }
}
