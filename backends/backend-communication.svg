<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="810" viewBox="0 0 1800 810" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>fs-web-springboot: how the backend apps communicate</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .lane      { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; }
      .lane-head { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .lane-title{ font-size: 15px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .app       { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
      .client    { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
      .infra     { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .node      { fill: #0f172a; text-anchor: middle; }
      .node-title{ font-weight: 700; font-size: 14px; }
      .edge      { fill: none; stroke: #334155; stroke-width: 1.6; marker-end: url(#arrow); }
      .edge-dot  { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .edge-dot-end { marker-end: url(#arrow-dot); }
      .label     { font-size: 11.5px; fill: #334155; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .title     { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .legend    { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1800" height="810" fill="#ffffff"/>
  <text class="title" x="20" y="32">fs-web-springboot — how the backend apps communicate</text>

  <!-- Lanes -->
  <rect class="lane" x="20"   y="84" width="380" height="686"/>
  <rect class="lane" x="420"  y="84" width="380" height="686"/>
  <rect class="lane" x="820"  y="84" width="380" height="686"/>
  <rect class="lane" x="1220" y="84" width="560" height="686"/>

  <rect class="lane-head" x="20"   y="50" width="380" height="34"/>
  <rect class="lane-head" x="420"  y="50" width="380" height="34"/>
  <rect class="lane-head" x="820"  y="50" width="380" height="34"/>
  <rect class="lane-head" x="1220" y="50" width="560" height="34"/>
  <text class="lane-title" x="210"  y="72">UI frontend</text>
  <text class="lane-title" x="610"  y="72">facade service</text>
  <text class="lane-title" x="1010" y="72">other backend services</text>
  <text class="lane-title" x="1500" y="72">db systems, kafka, etc. (backends/compose.yaml)</text>

  <!-- Edges (drawn before nodes so nodes sit on top) -->
  <!-- Browser -> facade -->
  <path class="edge" d="M320,415 H498"/>
  <text class="label" x="410" y="390">GET /api/hello</text>
  <text class="label" x="410" y="404">GET /api/overview</text>

  <!-- Browser -> visitor -->
  <path class="edge" d="M210,340 V225 Q210,210 225,210 H898"/>
  <text class="label" x="560" y="203">GET /api/visits</text>

  <!-- Browser -> stocks -->
  <path class="edge" d="M210,490 V625 Q210,640 225,640 H898"/>
  <text class="label" x="560" y="633">GET /api/stocks</text>

  <!-- facade -> visitor (HTTP service client) -->
  <path class="edge" d="M720,360 C800,360 820,245 898,245"/>
  <text class="label" x="810" y="292">HTTP GET /api/visits</text>
  <text class="label" x="810" y="306">spring.http.serviceclient.visitor</text>

  <!-- facade -> stocks (HTTP service client) -->
  <path class="edge" d="M720,470 C800,470 820,575 898,575"/>
  <text class="label" x="810" y="514">HTTP GET /api/stocks</text>
  <text class="label" x="810" y="528">spring.http.serviceclient.stocks</text>

  <!-- facade -> Kafka (produce) -->
  <path class="edge" d="M650,340 V115 Q650,100 665,100 H1325 Q1340,100 1340,115 V118"/>
  <text class="label" x="1000" y="94">produce VisitEvent (JSON) to topic fs-web.visits — VisitEventPublisher / KafkaTemplate</text>

  <!-- Kafka -> visitor (consume) -->
  <path class="edge" d="M1270,170 H1122"/>
  <text class="label" x="1195" y="151">consume, group visitor</text>
  <text class="label" x="1195" y="165">→ increments counter</text>

  <!-- visitor -> Valkey -->
  <path class="edge" d="M1120,255 C1190,255 1200,300 1268,300"/>
  <text class="label" x="1195" y="232">INCR / GET</text>
  <text class="label" x="1195" y="246">StringRedisTemplate</text>

  <!-- OTLP export (dotted) -->
  <path class="edge-dot" d="M610,490 V730"/>
  <path class="edge-dot" d="M1010,680 V730"/>
  <path class="edge-dot" d="M1100,280 V300 H1180 V730"/>
  <path class="edge-dot edge-dot-end" d="M610,730 H1445 V662"/>
  <text class="label" x="900" y="723">OTLP — logs, traces, metrics (all three backends)</text>

  <!-- Nodes -->
  <!-- Browser -->
  <rect class="client" x="100" y="340" width="220" height="150" rx="6"/>
  <text class="node" x="210" y="366">
    <tspan class="node-title">Browser / React UI</tspan>
    <tspan x="210" dy="22">dev: Vite :3000, one proxy</tspan>
    <tspan x="210" dy="16">entry per API owner</tspan>
    <tspan x="210" dy="22">prod: facade serves the UI,</tspan>
    <tspan x="210" dy="16">reverse proxy routes</tspan>
    <tspan x="210" dy="16">/api/visits and /api/stocks</tspan>
  </text>

  <!-- facade -->
  <rect class="app" x="500" y="340" width="220" height="150" rx="6"/>
  <text class="node" x="610" y="366">
    <tspan class="node-title">facade</tspan><tspan> :8080</tspan>
    <tspan x="610" dy="22">GET /api/hello</tspan>
    <tspan x="610" dy="16">GET /api/overview</tspan>
    <tspan x="610" dy="22">VisitEventPublisher</tspan>
    <tspan x="610" dy="16">VisitorClient, StocksClient</tspan>
    <tspan x="610" dy="16">(HTTP service client groups)</tspan>
  </text>

  <!-- visitor -->
  <rect class="app" x="900" y="140" width="220" height="140" rx="6"/>
  <text class="node" x="1010" y="166">
    <tspan class="node-title">visitor</tspan><tspan> :8081</tspan>
    <tspan x="1010" dy="22">GET /api/visits</tspan>
    <tspan x="1010" dy="16">POST /api/visits</tspan>
    <tspan x="1010" dy="22">VisitEventListener</tspan>
    <tspan x="1010" dy="16">VisitCounterService</tspan>
  </text>

  <!-- stocks -->
  <rect class="app" x="900" y="540" width="220" height="140" rx="6"/>
  <text class="node" x="1010" y="566">
    <tspan class="node-title">stocks</tspan><tspan> :8082</tspan>
    <tspan x="1010" dy="22">GET /api/stocks</tspan>
    <tspan x="1010" dy="16">GET /api/stocks/{symbol}</tspan>
    <tspan x="1010" dy="22">StockService</tspan>
    <tspan x="1010" dy="16">(in-memory map, no store yet)</tspan>
  </text>

  <!-- Kafka (cylinder) -->
  <path class="infra" d="M1270,132 a70,12 0 0 1 140,0 v76 a70,12 0 0 1 -140,0 z"/>
  <ellipse class="infra" cx="1340" cy="132" rx="70" ry="12"/>
  <text class="node" x="1340" y="168">
    <tspan class="node-title">Kafka</tspan><tspan> :9092</tspan>
    <tspan x="1340" dy="18">topic fs-web.visits</tspan>
  </text>

  <!-- Valkey (cylinder) -->
  <path class="infra" d="M1270,262 a70,12 0 0 1 140,0 v76 a70,12 0 0 1 -140,0 z"/>
  <ellipse class="infra" cx="1340" cy="262" rx="70" ry="12"/>
  <text class="node" x="1340" y="298">
    <tspan class="node-title">Valkey</tspan>
    <tspan x="1340" dy="18">visit counter</tspan>
  </text>

  <!-- Grafana LGTM -->
  <rect class="infra" x="1270" y="580" width="350" height="80" rx="6"/>
  <text class="node" x="1445" y="612">
    <tspan class="node-title">Grafana LGTM</tspan><tspan> :3001</tspan>
    <tspan x="1445" dy="20">OpenTelemetry collector + Loki / Tempo / Mimir</tspan>
  </text>

  <!-- unused compose services -->
  <text class="legend" x="1500" y="440" text-anchor="middle">also in compose.yaml, not used by any backend yet:</text>
  <text class="legend" x="1500" y="458" text-anchor="middle">mysql, postgres, dynamodb</text>

  <!-- Legend -->
  <text class="legend" x="20" y="796">solid arrow = request or message · dotted = OpenTelemetry export · ports are dev defaults; prod uses VISITOR_URL, STOCKS_URL, KAFKA_BOOTSTRAP_SERVERS and the Redis / OTLP env vars</text>
</svg>
