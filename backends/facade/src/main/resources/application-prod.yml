# Production profile: activate with --spring.profiles.active=prod
# Docker Compose support is not included in the packaged JAR, so the Kafka brokers, the
# downstream service URLs and the OTLP endpoint must be set explicitly (environment
# variables shown below).
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  http:
    serviceclient:
      visitor:
        base-url: ${VISITOR_URL:http://localhost:8081}
      stocks:
        base-url: ${STOCKS_URL:http://localhost:8082}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs

logging:
  level:
    org.fsweb.facade: INFO
