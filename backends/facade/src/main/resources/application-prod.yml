# Production profile: activate with --spring.profiles.active=prod
# Docker Compose support is not included in the packaged JAR, so the visitor URL and
# OTLP endpoint must be set explicitly (environment variables shown below).
facade:
  visitor:
    base-url: ${VISITOR_URL:http://localhost:8081}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs

logging:
  level:
    org.fsweb.facade: INFO
