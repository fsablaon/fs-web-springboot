spring:
  application:
    name: facade
  docker:
    compose:
      # Start compose.yaml services if they are not running, and leave them running
      # when the app stops (faster restarts, telemetry data is kept).
      # Stop them with: docker compose -p fs-web-springboot down
      lifecycle-management: start-only
      # Shared by all backends. Relative to the working directory, which is the project
      # root for ./mvnw spring-boot:run (see backends/pom.xml) and for IntelliJ.
      file: backends/compose.yaml
  kafka:
    # bootstrap-servers comes from Docker Compose support (apache/kafka image, port 9092) in dev
    # and from application-prod.yml in production.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 based JSON serializer (Spring Kafka 4); the Jackson 2 JsonSerializer has no databind on Boot 4's classpath
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Do not send the Java class name in a header: the visitor backend has its own VisitEvent class
        spring.json.add.type.headers: false
        # Upper bound on how long send() blocks when the broker is unreachable (default 60 s);
        # /api/hello calls send() on the request thread
        max.block.ms: 2000
    template:
      # Adds the trace context (traceparent) to each record so the visitor backend's listener span
      # joins the /api/hello trace in Grafana
      observation-enabled: true
    admin:
      # The template observation looks up the cluster id once through KafkaAdmin (retried every 5 min
      # after a failure). With the broker down this would block the first /api/hello for 30 s + the
      # admin client's 60 s default API timeout; these bound it to about 2 s.
      operation-timeout: 2s
      properties:
        default.api.timeout.ms: 2000
  http:
    clients:
      # Defaults for every HTTP client the facade builds. A service client group below
      # overrides whatever it needs.
      connect-timeout: 1s
      read-timeout: 2s
      redirects: dont-follow
    serviceclient:
      # One group per downstream service (see config/HttpServiceClientsConfig). Each group has
      # its own RestClient, request factory and settings. Other per-group keys: redirects,
      # ssl.bundle, default-header.<name>, cookie-handling. In dev the other backends run on
      # fixed ports; in production application-prod.yml takes the URLs from env vars.
      visitor:
        # GET /api/visits for /api/overview; short read timeout, the count is informational
        base-url: http://localhost:8081
        read-timeout: 1s
      stocks:
        # GET /api/stocks for /api/overview; a real quote source would be slower than the counter
        base-url: http://localhost:8082
        read-timeout: 3s

server:
  port: 8080

facade:
  visits:
    # Each /api/hello call publishes one VisitEvent to this topic; the visitor backend consumes it
    topic: fs-web.visits
    source: facade

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0   # trace every request in development

logging:
  level:
    root: INFO
    org.fsweb.facade: DEBUG
