# The project's own services (facade, visitor, stocks) as containers, plus an nginx gateway.
#
# Kept apart from compose.yaml on purpose:
#   - compose.yaml holds the EXTERNAL services (Valkey, Kafka, Grafana LGTM, databases). Spring
#     Boot's Docker Compose support starts that file on every `./mvnw spring-boot:run`.
#   - this file holds the PROJECT services. Nothing starts it automatically; it is a manual step:
#       docker compose -f backends/compose.apps.yaml up --build -d
#     The `include` below pulls compose.yaml into the same model, so that command also makes sure
#     the external services are up, and depends_on can refer to them. Same project name as
#     compose.yaml, so both files manage the same containers and network.
#
# Images come from backends/Dockerfile (one Maven build, one target per backend). The apps run the
# packaged JARs with the prod profile, so they are configured like a real deployment: through the
# environment variables application-prod.yml reads, pointing at the service names in compose.yaml.
# Host ports are the same as for ./mvnw spring-boot:run, so run a backend either on the host or as
# a container, not both.
#
# Stop only the project services (external ones keep running):
#   docker compose -f backends/compose.apps.yaml rm -sf facade visitor stocks gateway
# Stop and remove everything, both files:
#   docker compose -p fs-web-springboot down
# Design in docs/015-backends-in-containers.md.

name: fs-web-springboot

include:
  - compose.yaml     # relative to this file; external services + the volumes they use

services:
  facade:
    image: fs-web/facade:local
    build:
      context: ..                    # project root: the build needs pom.xml, frontend/ and backends/
      dockerfile: backends/Dockerfile
      target: facade
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092        # in-network listener, see kafka in compose.yaml
      VISITOR_URL: http://visitor:8081
      STOCKS_URL: http://stocks:8082
      OTLP_ENDPOINT: http://lgtm:4318
      TRACING_SAMPLING_PROBABILITY: "1.0"         # prod default is 0.1; trace everything locally
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      - kafka
      - lgtm
      - visitor
      - stocks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

  visitor:
    image: fs-web/visitor:local
    build:
      context: ..
      dockerfile: backends/Dockerfile
      target: visitor
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTLP_ENDPOINT: http://lgtm:4318
      TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      - valkey
      - kafka
      - lgtm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

  stocks:
    image: fs-web/stocks:local
    build:
      context: ..
      dockerfile: backends/Dockerfile
      target: stocks
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OTLP_ENDPOINT: http://lgtm:4318
      TRACING_SAMPLING_PROBABILITY: "1.0"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      - lgtm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

  gateway:
    # Reverse proxy in front of the three backends: the UI (served by facade) calls /api/visits and
    # /api/stocks on its own origin, so one entry point has to route by path, the way the Vite dev
    # server does in development and an ingress would in production. Config in gateway/nginx.conf.
    image: nginx:1.30-alpine
    ports:
      - "8088:80"     # http://localhost:8088 (8080-8082 are the backends, 8090 is Kafka UI)
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - facade
      - visitor
      - stocks
