# Local development services.
# Started automatically by spring-boot-docker-compose when running `mvn spring-boot:run`.
# Spring Boot reads the mapped ports from Docker and creates the Redis (Valkey), Kafka and
# OTLP connections itself, so no host/port properties are needed in application.yml.

# Keeps the Compose project name (and container names) the same as when this file
# was in the project root, so existing containers are reused.
name: fs-web-springboot

services:
  # Replaced by valkey below. Uncomment (and comment out valkey) to go back to Redis.
  # redis:
  #   image: redis:8.10-alpine
  #   ports:
  #     - "6379"        # random host port; Spring Boot discovers it

  valkey:
    # Redis-compatible (RESP protocol), used by spring-boot-starter-data-redis / Lettuce as-is
    image: valkey/valkey:9.1.3-alpine
    ports:
      - "6379"        # random host port; Spring Boot discovers it
    labels:
      # Spring Boot only recognizes images named "redis", "redis/redis-stack" or
      # "redis/redis-stack-server"; this label tells it to treat valkey as Redis.
      org.springframework.boot.service-connection: redis

  lgtm:
    # Grafana + Loki (logs) + Tempo (traces) + Mimir/Prometheus (metrics) + OTel Collector
    image: grafana/otel-lgtm:0.32.1
    ports:
      - "3001:3000"   # Grafana UI -> http://localhost:3001 (3000 is used by the Vite dev server)
      - "4317"        # OTLP gRPC
      - "4318"        # OTLP HTTP

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). The image's default config already runs
    # a combined broker+controller and advertises PLAINTEXT://localhost:9092 to clients.
    # Spring Boot recognizes the "apache/kafka" image and sets spring.kafka.bootstrap-servers
    # from the mapped port (requires spring-kafka on the classpath).
    image: apache/kafka:4.4.0
    ports:
      # Fixed host port on purpose: the broker tells clients to reconnect to localhost:9092
      # (advertised listener), so a random host port would not match and clients would fail
      # after the first metadata request.
      - "9092:9092"
